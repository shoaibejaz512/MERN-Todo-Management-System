name: flowdo

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowdo-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: ${FRONTEND_API_URL:?Set FRONTEND_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mern-stack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowdo-backend
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - mern-stack-network

  mongo:
    image: mongo:8
    container_name: flowdo-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mern-stack-network

  redis:
    image: redis:7-alpine
    container_name: flowdo-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mern-stack-network

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: flowdo-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - mern-stack-network

  grafana:
    image: grafana/grafana:12.1.0
    container_name: flowdo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - mern-stack-network

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: flowdo-alertmanager
    restart: unless-stopped

    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager

    secrets:
      - smtp_password

    networks:
      - mern-stack-network

volumes:
  mongo-data:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager_data:


secrets:
  smtp_password:
    file: ./secrets/smtp_password.txt

networks:
  mern-stack-network:
    driver: bridge