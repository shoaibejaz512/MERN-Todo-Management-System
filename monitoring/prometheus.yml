
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager connection
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Alert rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Metrics collection
scrape_configs:

  # FlowDo Backend
  - job_name: 'flowdo-backend'
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'backend:5000'
